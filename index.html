<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Luis Gabriel Araújo</title>

	<link rel="stylesheet" href="style.css">
	<script src="https://kit.fontawesome.com/f72d804116.js" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
	<div id="custom-cursor"></div>
	<div id="cursor-container"></div>

	<header id="header">
		<div class="header-container">
			<a href="#about" class="brand">
				<img id="pfp" alt="Foto de Luis Gabriel Araújo" src="/images/pfp.jpg">
			</a>

			<button id="bars" aria-label="Abrir Menu" onclick="toggleNavbar()">☰</button>

			<nav id="navbar" aria-label="Navegação Principal">
				<div id="info">
					<div class="lang-container">
						<i class="fa-solid fa-language" aria-hidden="true"></i>
						<select title="Idioma" id="lang-select" onchange="setLanguage(this.value)">
							<option value="pt-BR">Português</option>
							<option value="en">English</option>
						</select>
					</div>

					<ul class="nav-links">
						<li><a class="navbar-button about" href="#about"></a></li>
						<li><a class="navbar-button projects" href="#projects"></a></li>
						<li><a class="navbar-button contact" href="#contact"></a></li>
					</ul>
				</div>
			</nav>
		</div>
	</header>

	<aside id="social-medias" aria-label="Redes Sociais">
		<a class="social-media" href="https://github.com/luisgbr1el" target="_blank" rel="noopener noreferrer"
			aria-label="GitHub">
			<i class="fa-brands fa-github"></i>
		</a>
		<a class="social-media" href="https://www.linkedin.com/in/luisgbr1el/" target="_blank" rel="noopener noreferrer"
			aria-label="LinkedIn">
			<i class="fa-brands fa-linkedin-in"></i>
		</a>
		<a class="social-media" href="https://x.com/luisgbr1el" target="_blank" rel="noopener noreferrer"
			aria-label="X (Twitter)">
			<i class="fa-brands fa-x-twitter"></i>
		</a>
		<a class="social-media" href="https://instagram.com/luisgbr1el" target="_blank" rel="noopener noreferrer"
			aria-label="Instagram">
			<i class="fa-brands fa-instagram"></i>
		</a>
	</aside>

	<main id="main">
		<section id="about" class="section-container">
			<div class="section-content">
				<p class="subtitle about"></p>
				<h1 class="title introduction"></h1>
				<p id="about-text" class="text about-text"></p>
				<div class="cta-actions">
					<a class="button contact" href="#contact"></a>
				</div>
			</div>
		</section>

		<section id="projects" class="section-container">
			<div class="section-content">
				<p class="subtitle projects"></p>
				<h2 class="title projects-title"></h2>
				<div id="projects-grid" class="projects-grid">
					<div class="project-card">
						<div class="project-image">
							<img src="images/translator-bot.png" alt="Screenshot do projeto TranslatorBOT">
							<div class="project-image-placeholder">
								<i class="fa-solid fa-image"></i>
							</div>
						</div>
						<div class="project-content">
							<div class="project-header">
								<h3 class="project-title">TranslatorBOT</h3>
							</div>
							<p class="project-description project-translatorbot-desc"></p>
							<div class="project-tags">
								<span class="project-tag">JavaScript</span>
								<span class="project-tag">Discord.js</span>
								<span class="project-tag">Node.js</span>
							</div>
							<div class="project-links">
								<a class="project-link" href="https://github.com/luisgbr1el/TranslatorBOT" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do TranslatorBOT">
									<i class="fa-brands fa-github"></i> <span class="project-btn-code"></span>
								</a>
								<a class="project-link" href="https://translatorbot.gitbook.io" target="_blank" rel="noopener noreferrer" aria-label="Website do TranslatorBOT">
									<i class="fa-solid fa-arrow-up-right-from-square"></i> <span class="project-btn-website"></span>
								</a>
							</div>
						</div>
					</div>
					<div class="project-card">
						<div class="project-image">
							<img src="images/magearenaportuguese.png" alt="Screenshot do projeto Mage Arena Portuguese Mod">
							<div class="project-image-placeholder">
								<i class="fa-solid fa-image"></i>
							</div>
						</div>
						<div class="project-content">
							<div class="project-header">
								<h3 class="project-title">MageArena<wbr>Portuguese<wbr>Mod</h3>
							</div>
							<p class="project-description project-magearena-desc"></p>
							<div class="project-tags">
								<span class="project-tag">C#</span>
								<span class="project-tag">Unity</span>
								<span class="project-tag">BepInEx</span>
							</div>
							<div class="project-links">
								<a class="project-link" href="https://github.com/luisgbr1el/MageArenaPortugueseMod" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do MageArenaPortugueseMod">
									<i class="fa-brands fa-github"></i> <span class="project-btn-code"></span>
								</a>
								<a class="project-link" href="https://thunderstore.io/c/mage-arena/p/luisgbr1el/MageArenaPortuguese/" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do MageArenaPortugueseMod">
									<i class="fas fa-download"></i> <span class="project-btn-download"></span>
								</a>
							</div>
						</div>
					</div>
					<div class="project-card">
						<div class="project-image">
							<img src="images/ruufcbot.png" alt="Screenshot do projeto ru-ufc-bot">
							<div class="project-image-placeholder">
								<i class="fa-solid fa-image"></i>
							</div>
						</div>
						<div class="project-content">
							<div class="project-header">
								<h3 class="project-title">ru-ufc-bot</h3>
							</div>
							<p class="project-description project-ru-bot-desc"></p>
							<div class="project-tags">
								<span class="project-tag">JavaScript</span>
								<span class="project-tag">Node.js</span>
								<span class="project-tag">Telegram API</span>
							</div>
							<div class="project-links">
								<a class="project-link" href="https://github.com/luisgbr1el/ru-ufc-bot" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do ru-ufc-bot">
									<i class="fa-brands fa-github"></i> <span class="project-btn-code"></span>
								</a>
								<a class="project-link" href="https://t.me/SaldoRuUFCBot" target="_blank" rel="noopener noreferrer" aria-label="Acessar ru-ufc-bot no Telegram">
									<i class="fa-solid fa-arrow-up-right-from-square"></i> <span class="project-btn-demo"></span>
								</a>
							</div>
						</div>
					</div>
					<div class="project-card">
						<div class="project-image">
							<img src="images/backloggr.png" alt="Screenshot do projeto backloggr">
							<div class="project-image-placeholder">
								<i class="fa-solid fa-image"></i>
							</div>
						</div>
						<div class="project-content">
							<div class="project-header">
								<h3 class="project-title">backloggr</h3>
							</div>
							<p class="project-description project-backloggr-desc"></p>
							<div class="project-tags">
								<span class="project-tag">React</span>
								<span class="project-tag">Vite</span>
								<span class="project-tag">JavaScript</span>
							</div>
							<div class="project-links">
								<a class="project-link" href="https://github.com/luisgbr1el/backloggr" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do backloggr">
									<i class="fa-brands fa-github"></i> <span class="project-btn-code"></span>
								</a>
								<a class="project-link" href="https://mybackloggr.vercel.app" target="_blank" rel="noopener noreferrer" aria-label="Acessar backloggr online">
									<i class="fa-solid fa-arrow-up-right-from-square"></i> <span class="project-btn-demo"></span>
								</a>
							</div>
						</div>
					</div>
					<div class="project-card">
						<div class="project-image">
							<img src="images/lastbatch.png" alt="Screenshot do projeto last-batch">
							<div class="project-image-placeholder">
								<i class="fa-solid fa-image"></i>
							</div>
						</div>
						<div class="project-content">
							<div class="project-header">
								<h3 class="project-title">last-batch</h3>
							</div>
							<p class="project-description project-lastbatch-desc"></p>
							<div class="project-tags">
								<span class="project-tag">Python</span>
								<span class="project-tag">Last.fm API</span>
								<span class="project-tag">Desktop</span>
							</div>
							<div class="project-links">
								<a class="project-link" href="https://github.com/luisgbr1el/last-batch" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do last-batch">
									<i class="fa-brands fa-github"></i> <span class="project-btn-code"></span>
								</a>
								<a class="project-link" href="https://github.com/luisgbr1el/last-batch/releases/latest" target="_blank" rel="noopener noreferrer" aria-label="Repositório GitHub do last-batch">
									<i class="fas fa-download"></i> <span class="project-btn-download"></span>
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>

		<section id="contact" class="section-container">
			<div class="section-content">
				<p class="subtitle contact"></p>
				<h2 class="title work-together"></h2>
				<p id="contact-text" class="text contact-text"></p>
				<div class="cta-actions">
					<a class="button send-message" href="mailto:luisgabrielaraujo8@gmail.com" target="_blank"
						rel="noopener noreferrer"></a>
				</div>
			</div>
		</section>
	</main>

	<script src="script.js"></script>
</body>

</html>
